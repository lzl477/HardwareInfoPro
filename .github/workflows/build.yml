name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt/
        echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build APK with direct Gradle
      run: |
        echo "## Build Environment" >> $GITHUB_STEP_SUMMARY
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_STEP_SUMMARY
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_STEP_SUMMARY
        echo "Gradle: $(which gradle)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "Running gradle assembleDebug..."
        gradle assembleDebug --no-daemon --stacktrace --project-dir=. 2>&1 | tee build.log
        
        echo "## Build Result" >> $GITHUB_STEP_SUMMARY
        echo "Exit code: $?" >> $GITHUB_STEP_SUMMARY

    - name: Check Outputs
      if: always()
      run: |
        echo "## Output Check" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "APK files:" >> $GITHUB_STEP_SUMMARY
        find . -name "*.apk" -type f 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "None" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Build dir:" >> $GITHUB_STEP_SUMMARY
        ls -laR app/build/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build dir" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: HardwareInfoPro-APK
        path: "**/*.apk"
        if-no-files-found: warn
