name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        
        echo "=== Gradle wrapper test ==="
        ./gradlew --version 2>&1 || echo "gradlew --version failed"
        
        echo "=== Running build ==="
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
        
        echo "=== Build complete ==="
        echo "Exit code: $?"
        
        echo "=== Find APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        
        echo "=== App build directory ==="
        ls -laR app/build/ 2>/dev/null || echo "No app/build directory"
        
        echo "=== Root build directory ==="
        ls -la build/ 2>/dev/null || echo "No root build directory"

    - name: Create Release with APK
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK_FILE=$(find . -name "*.apk" -type f | head -1)
        if [ -n "$APK_FILE" ]; then
          echo "Found APK: $APK_FILE"
          TAG="v$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" "$APK_FILE" --title "HardwareInfoPro $TAG" --notes "Auto-built APK from commit ${{ github.sha }}"
          echo "Release created: $TAG"
        else
          echo "No APK file found!"
        fi
