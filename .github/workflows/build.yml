name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      shell: bash
      run: |
        chmod +x gradlew
        
        # Run build and capture output
        BUILD_OUTPUT=$(./gradlew assembleDebug --no-daemon --stacktrace 2>&1) || true
        BUILD_EXIT=$?
        
        echo "Build exit code: $BUILD_EXIT"
        
        # Write summary
        echo "## Build Result" >> $GITHUB_STEP_SUMMARY
        echo "Exit code: $BUILD_EXIT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Write last 100 lines of build output to summary
        echo "### Build Output (last 100 lines)" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "$BUILD_OUTPUT" | tail -100 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Write first 50 lines too (for early errors)
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Output (first 50 lines)" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "$BUILD_OUTPUT" | head -50 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Check for APK
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### APK Files" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        find . -name "*.apk" -type f 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "None found" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Save full log
        echo "$BUILD_OUTPUT" > build.log
        
        # List build outputs
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build outputs directory" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ls -laR app/build/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build dir" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Fail if no APK
        APK_COUNT=$(find . -name "*.apk" -type f 2>/dev/null | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "ERROR: No APK files generated!"
          exit 1
        fi

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: HardwareInfoPro-APK
        path: "**/*.apk"
        if-no-files-found: warn
