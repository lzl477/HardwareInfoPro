name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: List build outputs
      if: always()
      run: |
        echo "=== Find all APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        echo "=== Build outputs directory ==="
        ls -la app/build/outputs/ 2>/dev/null || echo "No outputs directory"
        ls -laR app/build/outputs/apk/ 2>/dev/null || echo "No APK directory"

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: HardwareInfoPro-APK
        path: "**/*.apk"
